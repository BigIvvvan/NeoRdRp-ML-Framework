task: family
data:
  train: data/train.parquet
  dev: data/dev.parquet
  max_len: 512
model:
  model: family
  encoder:
    name: transformer
    d_model: 384
    n_layers: 6
    n_heads: 8
    dropout: 0.1
    max_len: 512
  head:
    name: family
    hidden: 512
    n_classes: 65
output_dir: runs/family_demo
epochs: 15
batch_size: 32
lr: 2.0e-4
pos_weight: 1.0
class_weights: true
label_smoothing: 0.05
early_stopping_patience: 3
