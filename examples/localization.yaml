task: localization
data:
  train: data/train.parquet
  dev: data/dev.parquet
  max_len: 768
model:
  model: localizer
  encoder:
    name: transformer
    d_model: 256
    n_layers: 4
    n_heads: 8
    dropout: 0.1
    max_len: 768
  head:
    name: boundary
    hidden: 512
output_dir: runs/localization_demo
epochs: 8
batch_size: 16
lr: 1.0e-4
pos_weight: 20.0
grad_clip: 1.0
early_stopping_patience: 3
