[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neordrp-ml-framework"
version = "0.1.0"
description = "Composable deep-learning framework for RNA-dependent RNA polymerase (RdRp) detection, family classification, and boundary localization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BigIvan" }]
keywords = ["RdRp", "RNA virus", "protein", "deep learning", "bioinformatics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
mamba = ["mamba-ssm>=2.2"]
dev = ["build>=1.0", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/BigIvvvan/NeoRdRp-ML-Framework"
Repository = "https://github.com/BigIvvvan/NeoRdRp-ML-Framework"
Issues = "https://github.com/BigIvvvan/NeoRdRp-ML-Framework/issues"
Documentation = "https://github.com/BigIvvvan/NeoRdRp-ML-Framework/blob/main/GUIDE.md"

[project.scripts]
neordrp = "neordrp_ml_framework.cli:main"
neordrp-train = "neordrp_ml_framework.cli:train_main"
neordrp-predict = "neordrp_ml_framework.cli:predict_main"
neordrp-eval = "neordrp_ml_framework.cli:eval_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
